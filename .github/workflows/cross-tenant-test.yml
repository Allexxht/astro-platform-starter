name: Kereszt-teszt (cross-tenant isolation)

# Lásd CLAUDE.md "Többbérlős SaaS – terv" → "Kereszt-teszt: valódi kapu, nem emlékezet".
#
# Ez a workflow minden PR-on és a main-re irányuló push előtt lefuttatja a
# tests/cross-tenant/run.mjs kereszt-teszt scriptet egy eldobható, helyi Supabase
# CLI dev stack ellen (Docker-alapú Postgres+Auth+PostgREST+Storage, NEM az éles
# vagy a staging projekt).
#
# FONTOS – bootstrap vs. szigorú mód: amíg a többbérlős adatmodell (mk_companies
# tábla) nincs megépítve, ez a job ZÖLDEN fut le, egy jól látható üzenettel, hogy
# jelenleg nincs mit vizsgálnia (lásd run.mjs). Attól kezdve, hogy a mk_companies
# tábla megjelenik a sémában, a teszt szigorúvá válik: az adatbázisban keres meg
# minden company_id-s táblát/RPC-t, és bukik, ha bármelyik hiányzik a
# tests/cross-tenant/manifest.mjs-ből, vagy ha bármelyik kereszt-bérlős próba
# átmenne. Ez a branch protection-nel együtt (lásd CLAUDE.md) azt jelenti: a
# main-be a jelenlegi (egycéges) kód még mergelhető ezen a workflow-n keresztül,
# de a következő kör (adatmodell + RLS) csak akkor mergelhető, ha a manifest a
# sémával együtt, teljesen bővül, és a kereszt-bérlős próba valóban átmegy.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cross-tenant-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Supabase CLI telepítése
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Node függőségek telepítése
        run: npm ci

      - name: Egységtesztek – cégkezelő logika (cégtörlés, Cégek lista, GoTrue-hibák), hamis Supabase-szel
        # Nem kell hozzá a stack: minden hibaágat szándékosan elrontott
        # válaszokkal próbál (lásd tests/unit/admin-core.test.mjs).
        run: node --test tests/unit/admin-core.test.mjs

      - name: Helyi Supabase projekt inicializálása (ha még nincs supabase/config.toml)
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --workdir . --force
          fi

      - name: Helyi Supabase stack indítása (eldobható Docker Postgres+Auth+PostgREST+Storage)
        run: supabase start --workdir .

      - name: Supabase stack kapcsolati adatainak beolvasása
        # A `supabase status -o env` a legtöbb értéket idézőjelbe teszi (pl.
        # API_URL="http://..."), a DB_URL-t viszont nem. A GITHUB_ENV NEM
        # shell, nem vágja le az idézőjeleket – azok szó szerint az env var
        # értékének részévé válnak (pl. supabase-js URL-ellenőrzése ezen
        # bukik el: a "-lel kezdődő string nem http(s)://-sel kezdődik).
        # A sed lehántja a idézőjeleket minden "KEY=value" alakú sorról,
        # a már idézőjel nélküli sorokat (pl. DB_URL) érintetlenül hagyja.
        run: supabase status --workdir . -o env | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: DB_URL felülírása a helyi CLI ismert alapértelmezésével
        # A `supabase status` a DB_URL-ben lévő jelszót csillagokkal elrejti
        # (pl. "***127.0.0.1:54322/postgres"), emiatt psql nem tud vele
        # kapcsolódni. A helyi Supabase CLI dev stack felhasználóneve/jelszava
        # mindig postgres/postgres, a DB portja pedig a `supabase init`-tel most
        # generált supabase/config.toml alapértelmezése (54322) – ez nem valódi
        # titok, mert minden futásnál újra létrejövő, eldobható konténer.
        run: echo "DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: Séma alkalmazása (db/supabase-setup.sql + db/migrations/*.sql)
        run: |
          set -euo pipefail
          echo "Alkalmazás: db/supabase-setup.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f db/supabase-setup.sql
          for f in db/migrations/*.sql; do
            echo "Alkalmazás: $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Kereszt-teszt futtatása
        run: node tests/cross-tenant/run.mjs

      - name: Rendszergazda-műveletek a valódi helyi stack ellen (cégtörlés, Cégek lista, proba_ceg_torles.sql)
        # 1100 feltöltött rajz (több mint egy listázási oldal), szándékosan
        # elrontott lépés → pontos „félbemaradt” jelentés → újrapróbálva kész;
        # a szomszéd cég semmit nem veszít. Lásd tests/cross-tenant/company-admin.mjs.
        run: node tests/cross-tenant/company-admin.mjs

      - name: Böngészős próbák (jelszó-visszaállítás, Cégek nézet, Beállítások)
        # A futtató gépen lévő Chrome-mal (channel: chrome), a supabase-js
        # helyett teszt-klienssel (a Beállítások DEMÓ módban). A
        # playwright-core csak ide települ, a package.json-ba nem – a Netlify
        # buildet nem érinti. A settings.mjs a világos téma kontrasztját is
        # méri minden irodai nézetben.
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.63.0
          node tests/client/recovery.mjs
          node tests/client/companies.mjs
          node tests/client/settings.mjs

      - name: Supabase stack leállítása
        if: always()
        run: supabase stop --workdir . --no-backup

  # Külön job, saját eldobható Supabase stackkel: minden migrációt a hozzá
  # tartozó rollback scripttel EGYÜTT próbál ki, és bájtra pontosan
  # ellenőrzi, hogy a rollback után a séma (táblák/függvények/policy-k) és
  # az adat (sorszámok táblánként) pontosan visszaáll-e a migráció előtti
  # állapotra. A "migráció előtti állapot" forrása a db/supabase-setup.sql
  # a PR/push BÁZIS commitjáról (git show) – ez automatikusan a helyes
  # összevetési alapot adja, akárhányadik migrációt is adjuk hozzá a
  # jövőben, anélkül hogy egy külön, kézzel karbantartott "régi séma"
  # másolatot kellene fenntartani.
  cross-tenant-rollback-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (teljes git history kell a migráció előtti bázishoz)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Supabase CLI telepítése
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Helyi Supabase projekt inicializálása (ha még nincs supabase/config.toml)
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --workdir . --force
          fi

      - name: Helyi Supabase stack indítása (eldobható Docker Postgres+Auth+PostgREST+Storage)
        run: supabase start --workdir .

      - name: DB_URL beállítása (lásd a másik job azonos lépésének magyarázatát)
        run: echo "DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: A migráció ELŐTTI állapot alkalmazása (db/supabase-setup.sql a PR/push bázisáról)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          echo "Alapállapot forrása: $BASE_REF"
          git show "$BASE_REF:db/supabase-setup.sql" > /tmp/baseline_setup.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/baseline_setup.sql

      - name: Migráció előtti állapot előállítása (MINDEN rollback, fordított sorrendben)
        # Amióta a migrációk mergelve vannak, a db/supabase-setup.sql MAGA IS
        # tartalmazza a tartalmukat – a bázis tehát már "migrált" állapot. Ha innen
        # indulnánk mérni, a migrációk no-opok lennének, a rollbackek viszont
        # leszednék a sémát, és az összevetés szükségszerűen eltérést találna.
        # Ezért előbb VISSZAFELÉ végigfuttatjuk az összes rollbackot (004, majd 003),
        # és onnan, a migráció előtti állapotból indul a mérés.
        #
        # Miért fordított sorrendben: a későbbi migráció a korábbira épül (a 004
        # licenc-triggere például a 003 mk_current_company() függvényét hívja) –
        # ha a 003-at szednénk le előbb, a 004 maradéka hivatkozna egy már nem
        # létező függvényre. Pontosan így bukott el ez a job a 004 mergelése után.
        #
        # A hibatűrés szándékos: ha egy rollback azért hibázik, mert az a migráció
        # nincs is benne a bázisban (pl. a PR most vezeti be), az nem baj – a
        # rollback scriptek egy tranzakcióban futnak, tehát vagy teljesen lefutnak,
        # vagy semmit nem csinálnak. A tényleges állítást a lenti összevetés adja.
        run: |
          set -uo pipefail
          for f in $(ls -1 db/migrations/rollback/*.sql | sort -r); do
            echo "Visszaállítás a kiinduló állapothoz: $f"
            if psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" > /tmp/rb.log 2>&1; then
              echo "  alkalmazva"
            else
              echo "  kihagyva (valószínűleg nincs benne a bázisban):"
              tail -3 /tmp/rb.log | sed 's/^/    /'
            fi
          done

      - name: Előtte-pillanatkép (séma + sorszámok táblánként)
        run: |
          set -euo pipefail
          psql "$DB_URL" -t -A -c "select string_agg(table_name, ',' order by table_name) from information_schema.tables where table_schema='public';" > /tmp/tables_before.txt
          psql "$DB_URL" -t -A -c "select string_agg(proname, ',' order by proname) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public';" > /tmp/funcs_before.txt
          psql "$DB_URL" -t -A -c "select string_agg(policyname, ',' order by policyname) from pg_policies where schemaname in ('public','storage');" > /tmp/policies_before.txt
          psql "$DB_URL" -t -A -c "
            select string_agg(t || '=' || c, ',' order by t) from (
              select 'mk_teams' t, count(*) c from public.mk_teams union all
              select 'mk_locations', count(*) from public.mk_locations union all
              select 'mk_employees', count(*) from public.mk_employees union all
              select 'mk_tasks', count(*) from public.mk_tasks union all
              select 'mk_terminals', count(*) from public.mk_terminals union all
              select 'mk_assignments', count(*) from public.mk_assignments union all
              select 'mk_attachments', count(*) from public.mk_attachments union all
              select 'mk_assignment_attachments', count(*) from public.mk_assignment_attachments union all
              select 'mk_events', count(*) from public.mk_events union all
              select 'mk_pins', count(*) from public.mk_pins union all
              select 'mk_pin_failures', count(*) from public.mk_pin_failures
            ) x;" > /tmp/counts_before.txt
          echo "Előtte (sorszámok):" && cat /tmp/counts_before.txt

      - name: MINDEN migráció alkalmazása sorrendben (ennek a PR-nak/branch-nek a verziója)
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            echo "Alkalmazás: $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: MINDEN rollback alkalmazása fordított sorrendben
        # Itt már NEM tűrünk hibát: ezek a migrációk ebben a körben lettek
        # alkalmazva, tehát mindegyik rollbacknek le KELL futnia.
        run: |
          set -euo pipefail
          for f in $(ls -1 db/migrations/rollback/*.sql | sort -r); do
            echo "Visszaállítás: $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Utána-pillanatkép + összehasonlítás
        run: |
          set -euo pipefail
          psql "$DB_URL" -t -A -c "select string_agg(table_name, ',' order by table_name) from information_schema.tables where table_schema='public';" > /tmp/tables_after.txt
          psql "$DB_URL" -t -A -c "select string_agg(proname, ',' order by proname) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public';" > /tmp/funcs_after.txt
          psql "$DB_URL" -t -A -c "select string_agg(policyname, ',' order by policyname) from pg_policies where schemaname in ('public','storage');" > /tmp/policies_after.txt
          psql "$DB_URL" -t -A -c "
            select string_agg(t || '=' || c, ',' order by t) from (
              select 'mk_teams' t, count(*) c from public.mk_teams union all
              select 'mk_locations', count(*) from public.mk_locations union all
              select 'mk_employees', count(*) from public.mk_employees union all
              select 'mk_tasks', count(*) from public.mk_tasks union all
              select 'mk_terminals', count(*) from public.mk_terminals union all
              select 'mk_assignments', count(*) from public.mk_assignments union all
              select 'mk_attachments', count(*) from public.mk_attachments union all
              select 'mk_assignment_attachments', count(*) from public.mk_assignment_attachments union all
              select 'mk_events', count(*) from public.mk_events union all
              select 'mk_pins', count(*) from public.mk_pins union all
              select 'mk_pin_failures', count(*) from public.mk_pin_failures
            ) x;" > /tmp/counts_after.txt
          echo "Utána (sorszámok):" && cat /tmp/counts_after.txt

          FAIL=0
          diff -u /tmp/tables_before.txt /tmp/tables_after.txt || { echo "::error::A tábla-lista eltér a rollback után – a séma nem állt vissza pontosan."; FAIL=1; }
          diff -u /tmp/funcs_before.txt /tmp/funcs_after.txt || { echo "::error::A függvény-lista eltér a rollback után – a séma nem állt vissza pontosan."; FAIL=1; }
          diff -u /tmp/policies_before.txt /tmp/policies_after.txt || { echo "::error::A policy-lista eltér a rollback után – a séma nem állt vissza pontosan."; FAIL=1; }
          diff -u /tmp/counts_before.txt /tmp/counts_after.txt || { echo "::error::Eltérő sorszám a rollback után – ADATVESZTÉS a migráció+visszaállítás körben."; FAIL=1; }

          if [ "$FAIL" = "1" ]; then
            echo "A migrációk + a hozzájuk tartozó rollbackek NEM állítják vissza pontosan az eredeti állapotot."
            exit 1
          fi
          echo "OK: minden migráció + rollback kör után a séma és minden tábla sorszáma pontosan egyezik a migráció előttivel."

      - name: Supabase stack leállítása
        if: always()
        run: supabase stop --workdir . --no-backup
